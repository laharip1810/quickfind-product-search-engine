spring:
  datasource:
    url: jdbc:h2:mem:quickfind-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

management:
  health:
    redis:
      enabled: false

logging:
  level:
    com.quickfind: WARN

quickfind:
  cache:
    enabled: false
  suggestions:
    rebuild-check-interval-ms: 3600000
    popular-query-refresh-interval-ms: 3600000
