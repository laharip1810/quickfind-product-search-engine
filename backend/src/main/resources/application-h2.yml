# Zero-setup demo profile: in-memory H2 (MySQL mode), no Redis.
# Run with: mvnw spring-boot:run "-Dspring-boot.run.profiles=h2"
spring:
  datasource:
    url: jdbc:h2:mem:quickfind;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

management:
  health:
    redis:
      enabled: false

quickfind:
  cache:
    enabled: false
